name: Feed NGNL

# Co 4 godziny zbiera wiadomości o No Game No Life z publicznych kanałów RSS
# i zapisuje je w data/ngnl-feed.json. Aplikacja czyta ten plik jako dodatkowe źródło.
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ngnl-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Zbuduj feed
        run: node tools/build-feed.mjs
      - name: Zapisz zmiany
        run: |
          git config user.name "ngnl-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ngnl-feed.json
          if git diff --staged --quiet; then
            echo "Brak nowych wiadomości."
          else
            git commit -m "Feed NGNL: aktualizacja $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
