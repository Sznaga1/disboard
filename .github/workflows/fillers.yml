name: Baza fillerów

# Co 3 godziny czyta strony odcinków MyAnimeList (fillery, recapy, oceny odcinków)
# dla serii z AniList (wszystkie od 20 odcinków, potem krótsze o popularności > 2000)
# i zapisuje je w data/fillers.json i data/eps/.
# Zastępuje Jikan, który przestał odpowiadać. Każdy przebieg ma limit czasu;
# czego nie zdąży, zrobi następny (najpierw nowe serie, potem najdawniej sprawdzane).
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Ile minut na strony MAL'
        required: false
        default: '20'

permissions:
  contents: write

concurrency:
  group: fillers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Zbierz fillery z MyAnimeList
        run: node tools/build-fillers.mjs --minutes=${{ github.event.inputs.minutes || '20' }}
      - name: Zapisz zmiany
        if: always()
        run: |
          git config user.name "fillers-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fillers.json data/fillers-targets.json data/eps
          if git diff --staged --quiet; then
            echo "Bez zmian."
          else
            git commit -m "Baza fillerów: aktualizacja $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
